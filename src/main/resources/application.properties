server.port=${PORT:8080}

# All of these fall back to the local docker-compose values when the env
# vars aren't set, so `mvn spring-boot:run` on your machine keeps working
# exactly as before. On Render, the render.yaml blueprint injects the real
# values (DATABASE_URL from the managed Postgres instance, GNN_SERVICE_URL
# pointing at the deployed sidecar).
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5433}/${DATABASE_NAME:knowledgeos}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=30000

gnn.service.url=${GNN_SERVICE_URL:http://localhost:8001}

embedding.service.url=${EMBEDDING_SERVICE_URL:http://localhost:8000}

llm.api.key=${LLM_API_KEY}
llm.model=claude-haiku-4-5-20251001
llm.max-tokens=1024

crawler.max-pages-per-dataset=300