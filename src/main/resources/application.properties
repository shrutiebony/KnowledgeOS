spring.datasource.url=jdbc:postgresql://localhost:5433/knowledgeos
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=30000

# GNN sidecar service (see gnn-service/) - published by docker-compose on 8001
gnn.service.url=http://localhost:8001

# Dynamic crawler (CrawlerWorker) will stop queuing newly discovered links
# once a dataset has this many documents, so a same-host crawl can't grow
# unboundedly. Already-queued items still get crawled past this point, and
# link edges are still recorded for HITS - only new frontier expansion stops.
crawler.max-pages-per-dataset=300