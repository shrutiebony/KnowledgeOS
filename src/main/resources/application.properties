server.port=8080
spring.application.name=KnowledgeOS

spring.datasource.url=jdbc:h2:file:./data/knowledgeos;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

spring.servlet.multipart.max-file-size=32MB
spring.servlet.multipart.max-request-size=64MB

knowledgeos.embed.url=
knowledgeos.embed.dim=128
knowledgeos.graph.k=8
knowledgeos.graph.min-cosine=0.32
knowledgeos.graphsage.python=python
knowledgeos.graphsage.script=tools/graphsage/graphsage_embed.py
knowledgeos.seed.wikipedia=true
knowledgeos.crawl.max-depth=2
knowledgeos.crawl.max-pages=80
knowledgeos.crawl.timeout-ms=12000
knowledgeos.crawl.delay-ms=200

# India Wikipedia ingest (replaces the old 48-article sample). Independent of the generic URL crawler.
knowledgeos.wikipedia-india.crawl=true
knowledgeos.wikipedia-india.max-pages=2000
knowledgeos.wikipedia-india.max-depth=4
knowledgeos.wikipedia-india.delay-ms=300
knowledgeos.wikipedia-india.timeout-ms=15000
knowledgeos.wikipedia-india.flush-every=25

# Classification bands (not proof of authorship). Wider uncertain gap so a
# compressed encyclopedia is not labeled 100% human.
knowledgeos.band.ai-min=0.58
knowledgeos.band.human-max=0.42
knowledgeos.band.max-interval=0.50
knowledgeos.calibrate.rank-mix=0.38
