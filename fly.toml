app = "knowledgeos-dashboard"
primary_region = "sjc"
 
[build]
  dockerfile = "Dockerfile"

[env]
  CRAWL = "false"
  KNOWLEDGEOS_DB = "/data/knowledgeos.db"
  KNOWLEDGEOS_GDELT_CRAWL = "false"
  KNOWLEDGEOS_WEB = "/app/web"
  KNOWLEDGEOS_WIKIPEDIA_CRAWL = "false"
  PORT = "8080"
  SERVER_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
