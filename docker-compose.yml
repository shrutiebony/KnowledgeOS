services:
  knowledgeos:
    build: .
    image: knowledgeos:linux
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - knowledgeos-data:/data
    environment:
      PORT: "8080"
      KNOWLEDGEOS_DB: /data/knowledgeos.db
      KNOWLEDGEOS_WEB: /app/web
      KNOWLEDGEOS_WIKIPEDIA_CRAWL: "false"
      KNOWLEDGEOS_GDELT_CRAWL: "false"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

volumes:
  knowledgeos-data:
