# Local: docker compose up --build
# Dashboard: http://localhost:8080
# SQLite file persists at ./data/knowledgeos.db (mapped to the image VOLUME /data).
services:
  knowledgeos:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      SERVER_PORT: "8080"
      KNOWLEDGEOS_DB: "/data/knowledgeos.db"
      KNOWLEDGEOS_WEB: "/app/web"
      # Default crawl cap is 2000 Wikipedia pages (RAM + egress).
      # Uncomment for a lighter first run:
      # KNOWLEDGEOS_WIKIPEDIA_INDIA_CRAWL: "false"
      # KNOWLEDGEOS_WIKIPEDIA_INDIA_MAX_PAGES: "80"
    volumes:
      - ./data:/data
    restart: unless-stopped
