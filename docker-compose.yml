services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowledgeos-postgres
    environment:
      POSTGRES_DB: knowledgeos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - knowledgeos-postgres-data:/var/lib/postgresql/data

  gnn-service:
    build: ./gnn-service
    container_name: knowledgeos-gnn
    ports:
      - "8001:8001"

  embedding-service:
    build: ./embedding-service
    container_name: knowledgeos-embeddings
    ports:
      - "8000:8000"

volumes:
  knowledgeos-postgres-data: