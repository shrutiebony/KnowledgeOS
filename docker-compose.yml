# Local: docker compose up --build
# Dashboard: http://localhost:8080
# SQLite file persists at ./data/knowledgeos.db (mapped to the image VOLUME /data).
services:
  knowledgeos:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      SERVER_PORT: "8080"
      KNOWLEDGEOS_DB: "/data/knowledgeos.db"
      KNOWLEDGEOS_WEB: "/app/web"
      # Wikipedia and GDELT seed in the background. URL ingest gates on 1000 reachable pages.
      # KNOWLEDGEOS_WIKIPEDIA_CRAWL: "false"
      # KNOWLEDGEOS_GDELT_CRAWL: "false"
    volumes:
      - ./data:/data
    restart: unless-stopped
