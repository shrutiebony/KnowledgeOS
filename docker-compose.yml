services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowledgeos-postgres
    environment:
      POSTGRES_DB: knowledgeos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - knowledgeos-postgres-data:/var/lib/postgresql/data

volumes:
  knowledgeos-postgres-data: